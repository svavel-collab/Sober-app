<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sober</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

  <div class="app-container">
    
    <!-- Top Navigation -->
    <header class="top-nav">
      <div class="header-left-group">
        <h1 class="header-sober">Sober</h1>
        <span class="date-header" id="currentDateHeader"></span>
      </div>
      <div class="nav-icons-right">
        <button class="icon-btn" id="trashBinBtn" title="Papperskorg">🗑️</button>
        <button class="icon-btn" id="settingsBtn" title="Inställningar">⚙️</button>
        <button class="icon-btn" id="addCatBtn" title="Lägg till">+</button>
      </div>
    </header>

    <!-- Category List -->
    <main class="list-container" id="categoriesContainer"></main>

  </div>

  <!-- Modal: Add / Edit Category -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <h2 id="modalTitle" style="margin-bottom: 16px; color: #fff; font-size: 1.2rem;">Ny kategori</h2>
      <input type="hidden" id="editCatId">
      
      <div style="margin-bottom: 14px;">
        <label style="display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px;">Kategorinamn:</label>
        <input type="text" id="catNameInput" placeholder="T.ex. Alkohol">
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px;">Startdatum & tid:</label>
        <input type="datetime-local" id="catDateInput">
      </div>

      <div class="btn-group">
        <button class="btn-outline" onclick="closeModal()">Avbryt</button>
        <button class="btn-primary" onclick="saveCategory()">Spara</button>
      </div>
    </div>
  </div>

  <!-- Modal: Settings (Export/Import) -->
  <div class="modal-overlay" id="settingsModalOverlay">
    <div class="modal-card">
      <h2 style="margin-bottom: 16px; color: #fff; font-size: 1.2rem;">Inställningar</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px;">
        Säkerhetskopiera din data eller återställ från en tidigare JSON-fil.
      </p>

      <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px;">
        <button class="btn-primary" onclick="exportData()">Spara ner fil (Export)</button>
        
        <label class="btn-outline" style="text-align: center; cursor: pointer; display: block;">
          Ladda upp fil (Import)
          <input type="file" id="importFileInput" accept=".json" style="display: none;" onchange="importData(event)">
        </label>
      </div>

      <button class="btn-outline" style="width: 100%;" onclick="closeSettingsModal()">Stäng</button>
    </div>
  </div>

  <!-- Modal: Trash Bin -->
  <div class="modal-overlay" id="trashModalOverlay">
    <div class="modal-card">
      <h2 style="margin-bottom: 16px; color: #fff; font-size: 1.2rem;">Papperskorg</h2>
      <div id="trashContainer" style="display: flex; flex-direction: column; gap: 10px; max-height: 260px; overflow-y: auto; margin-bottom: 20px;">
        <!-- Dynamiska rader hamnar här -->
      </div>
      <button class="btn-outline" style="width: 100%;" onclick="closeTrashModal()">Stäng</button>
    </div>
  </div>

  <!-- Modal: Custom Confirm Dialog -->
  <div class="modal-overlay" id="confirmModalOverlay">
    <div class="modal-card">
      <p id="confirmModalText" style="margin-bottom: 20px; color: #fff; font-size: 1rem; text-align: center; font-weight: 600;"></p>
      <div class="btn-group">
        <button class="btn-outline" id="confirmCancelBtn">Avbryt</button>
        <button class="btn-primary" id="confirmOkBtn">OK</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=2"></script>
</body>
</html>
