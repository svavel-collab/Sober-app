<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sober</title>
  
  <link rel="icon" type="image/png" sizes="512x512" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#05080c">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <header class="top-nav">
      <div class="header-left-group">
        <h1 class="header-sober">Sober</h1>
        <div class="date-header" id="currentDateHeader">29 aug</div>
      </div>
      <div class="nav-icons-right">
        <button class="icon-btn" id="trashBinBtn" title="Papperskorg">🗑️</button>
        <button class="icon-btn" id="settingsBtn" title="Inställningar / Import / Export">⚙️</button>
        <button class="icon-btn" id="addCatBtn" title="Lägg till">+</button>
      </div>
    </header>

    <div id="categoriesContainer" class="list-container"></div>
  </div>

  <!-- Modal för ny kategori -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <h3 id="modalTitle" style="color:var(--accent-purple); margin-bottom:12px; font-size:1.1rem;">Ny kategori</h3>
      <input type="text" id="catNameInput" placeholder="Namn (t.ex. Alkohol)">
      <label style="font-size:0.8rem; color:var(--text-muted); margin-top:12px; display:block;">Startdatum & tid:</label>
      <input type="datetime-local" id="catDateInput">
      <div class="btn-group" style="margin-top:16px;">
        <button class="btn-outline" onclick="closeModal()">Avbryt</button>
        <button class="btn-primary" onclick="saveCategory()">Spara</button>
      </div>
    </div>
  </div>

  <!-- Modal för Papperskorg (Återställ borttagna) -->
  <div class="modal-overlay" id="trashModalOverlay">
    <div class="modal-card" style="max-height: 80vh; display: flex; flex-direction: column;">
      <h3 style="color:var(--accent-purple); margin-bottom:12px; font-size:1.1rem;">Papperskorg</h3>
      <div id="trashContainer" style="overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; max-height: 50vh;">
        <!-- Borttagna objekt dyker upp här -->
      </div>
      <div class="btn-group">
        <button class="btn-outline" onclick="closeTrashModal()" style="width:100%;">Stäng</button>
      </div>
    </div>
  </div>

  <!-- Modal för Inställningar (JSON Import/Export) -->
  <div class="modal-overlay" id="settingsModalOverlay">
    <div class="modal-card">
      <h3 style="color:var(--accent-purple); margin-bottom:12px; font-size:1.1rem;">Inställningar & Data</h3>
      <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:16px;">Exportera eller importera din JSON-data för säkerhets skull.</p>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button class="btn-primary" onclick="exportData()">Exportera JSON</button>
        <label class="btn-outline" style="text-align: center; cursor: pointer; display: block; padding: 12px; border-radius: 12px;">
          Importera JSON <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData(event)">
        </label>
      </div>
      <div style="margin-top: 16px;">
        <button class="btn-outline" onclick="closeSettingsModal()" style="width:100%;">Stäng</button>
      </div>
    </div>
  </div>

  <!-- Egen bekräftelsemodal -->
  <div class="modal-overlay" id="confirmModalOverlay">
    <div class="modal-card">
      <h3 id="confirmModalText" style="color:var(--text-main); margin-bottom:20px; font-size:1.05rem; font-weight:600;">Radera inlägget?</h3>
      <div class="btn-group">
        <button class="btn-outline" id="confirmCancelBtn">Avbryt</button>
        <button class="btn-primary" id="confirmOkBtn">OK</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
