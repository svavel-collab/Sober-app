<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0d12">
  <title>Sober</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <div class="header-title">
        <h1>Sober</h1>
        <span id="current-date" class="header-date"></span>
      </div>
      <div class="header-actions">
        <button id="open-trash-btn" class="btn-icon" aria-label="Papperskorg" title="Papperskorg">🗑️</button>
        <button id="open-settings-btn" class="btn-icon" aria-label="Inställningar" title="Import / Export">⚙️</button>
        <button id="open-modal-btn" class="btn-add" aria-label="Lägg till kategori">+</button>
      </div>
    </header>

    <main id="tracker-list" class="tracker-list">
      <!-- Kategori-kort renderas dynamiskt här -->
    </main>
  </div>

  <!-- Modal för att lägga till eller redigera kategori -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modal-title">Ny kategori</h2>
      <form id="add-form">
        <input type="hidden" id="edit-id" value="">
        
        <label for="category-name">Namn</label>
        <input type="text" id="category-name" placeholder="t.ex. Alkohol, Snus, Amfetamin" required>

        <label for="start-date">Startdatum & tid</label>
        <input type="datetime-local" id="start-date" required>

        <div class="modal-actions">
          <button type="button" id="close-modal-btn" class="btn-secondary">Avbryt</button>
          <button type="submit" class="btn-primary">Spara</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal för Import / Export (Kugghjul) -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Datahantering</h2>
      <p class="modal-desc">Exportera din data som säkerhetskopia eller importera sparad data.</p>
      <div class="settings-buttons">
        <button id="export-btn" class="btn-primary">Exportera JSON</button>
        <button id="import-btn-trigger" class="btn-secondary-bordered">Importera JSON</button>
        <input type="file" id="import-file-input" accept=".json" style="display: none;">
      </div>
      <div class="modal-actions">
        <button type="button" id="close-settings-btn" class="btn-secondary">Stäng</button>
      </div>
    </div>
  </div>

  <!-- Modal för Papperskorg -->
  <div id="trash-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Papperskorg</h2>
      <div id="trash-list" class="trash-list">
        <!-- Raderade poster hamnar här -->
      </div>
      <div class="modal-actions space-between">
        <button type="button" id="empty-trash-btn" class="btn-danger-text">Töm papperskorg</button>
        <button type="button" id="close-trash-btn" class="btn-secondary">Stäng</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
          console.error('Service Worker registrering misslyckades:', err);
        });
      });
    }
  </script>
</body>
</html>
